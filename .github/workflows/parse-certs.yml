name: Parse Certs

# Runs automatically whenever certs/, parser/, or requirements.txt change,
# and can still be triggered manually from the Actions tab.
on:
  push:
    paths:
      - "certs/**"
      - "parser/**"
      - "requirements.txt"
  workflow_dispatch:

# Let the workflow push its own commit back to the repo.
permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tesseract (for OCR fallback)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python parser/parser.py

      - name: Commit updated CSV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update skills.csv"
          file_pattern: output/skills.csv

      - name: Upload results as artifact too
        uses: actions/upload-artifact@v4
        with:
          name: skills-csv
          path: output/skills.csv
